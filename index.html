<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamiltonian Gift Exchange</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    input[type="file"], textarea, button { display: block; margin-bottom: 1rem; width: 100%; max-width: 500px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .box { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>🎁 Hamiltonian Gift Exchange</h1>

  <!-- Upload and Manual Entry Code Omitted for Brevity -->

  <script>
    let parsedNames = [];
    let parsedBadPairs = [];
    let parsedHistory = {};

    function parseHistoryText(text) {
      const lines = text.trim().split(/\r?\n/);
      const history = {};
      let currentYear = null;

      for (const line of lines) {
        const parts = line.split(',').map(s => s.trim());
        const yearMatch = parts.length === 1 ? parts[0] : (parts.length === 2 && /^\d{4},?$/.test(parts[0]) && parts[1] === '') ? parts[0] : null;

        if (yearMatch && /^\d{4}$/.test(yearMatch.replace(/,$/, ''))) {
          currentYear = yearMatch.replace(/,$/, '');
          history[currentYear] = [];
        } else if (parts.length === 2 && currentYear) {
          history[currentYear].push([parts[0], parts[1]]);
        }
      }

      return history;
    }

    function buildGraph(names, badpairs) {
      const graph = {};
      names.forEach(name => {
        graph[name] = names.filter(other => other !== name);
      });
      badpairs.forEach(([a, b]) => {
        if (graph[a]) graph[a] = graph[a].filter(x => x !== b);
      });
      return graph;
    }

    function findHamiltonianPath(graph, path = [], visited = new Set()) {
      if (path.length === Object.keys(graph).length) return path;

      const last = path[path.length - 1];
      const candidates = last ? graph[last] : Object.keys(graph);

      for (const next of shuffle([...candidates])) {
        if (!visited.has(next)) {
          visited.add(next);
          path.push(next);
          const result = findHamiltonianPath(graph, path, visited);
          if (result) return result;
          visited.delete(next);
          path.pop();
        }
      }
      return null;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function runHamiltonianProcess() {
      let graph = buildGraph(parsedNames, parsedBadPairs);
      const historyYears = Object.keys(parsedHistory).sort().reverse();

      let path = null;
      for (let i = 0; i <= historyYears.length; i++) {
        const attempt = findHamiltonianPath(graph);
        if (!attempt) {
          alert("Best possible Hamiltonian Path:\n" + path.join(" → "));
          return;
        }
        path = attempt;
        if (i < historyYears.length) {
          const year = historyYears[i];
          parsedHistory[year].forEach(([a, b]) => {
            if (graph[a]) graph[a] = graph[a].filter(x => x !== b);
          });
        }
      }
      alert("Final Hamiltonian Path:\n" + path.join(" → "));
    }

    function parseCSVs() {
      const namesFile = document.getElementById('namesCSV').files[0];
      const badpairsFile = document.getElementById('badpairsCSV').files[0];
      const historyFile = document.getElementById('historyCSV').files[0];

      if (!namesFile || !badpairsFile || !historyFile) {
        alert("Please upload all three CSV files.");
        return;
      }

      const reader1 = new FileReader();
      const reader2 = new FileReader();
      const reader3 = new FileReader();

      reader1.onload = function (e) {
        parsedNames = e.target.result.trim().split(',').map(s => s.trim());
        document.getElementById('outputNames').textContent = parsedNames.join("\n");
      };

      reader2.onload = function (e) {
        parsedBadPairs = e.target.result.trim().split(/\r?\n/).map(line => line.split(',').map(s => s.trim()));
        document.getElementById('outputBadpairs').textContent = parsedBadPairs.map(p => p.join(" → ")).join("\n");
      };

      reader3.onload = function (e) {
        parsedHistory = parseHistoryText(e.target.result);
        document.getElementById('outputHistory').textContent = formatHistoryObject(parsedHistory);
        runHamiltonianProcess();
      };

      reader1.readAsText(namesFile);
      reader2.readAsText(badpairsFile);
      reader3.readAsText(historyFile);
    }

    function parseManual() {
      parsedNames = document.getElementById('namesManual').value.split(',').map(s => s.trim());
      parsedBadPairs = document.getElementById('badpairsManual').value.trim().split(/\r?\n/).map(line => line.split(',').map(s => s.trim()));
      parsedHistory = parseHistoryText(document.getElementById('historyManual').value);

      document.getElementById('outputNames').textContent = parsedNames.join("\n");
      document.getElementById('outputBadpairs').textContent = parsedBadPairs.map(p => p.join(" → ")).join("\n");
      document.getElementById('outputHistory').textContent = formatHistoryObject(parsedHistory);
      runHamiltonianProcess();
    }
  </script>
</body>
</html>
